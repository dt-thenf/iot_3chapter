name: Build IoT 3 chapters and six questions
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tong_hop_3_chuong_iot/*.tex'
      - 'tong_hop_3_chuong_iot/build.sh'
      - 'tong_hop_3_chuong_iot/assets/chapter1/**'
      - 'tong_hop_3_chuong_iot/source/base64/**'
      - 'tong_hop_3_chuong_iot/scripts/**'
      - '.github/workflows/build-iot-study-bundle.yml'
permissions:
  contents: write
jobs:
  compile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install LuaLaTeX and PDF tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y texlive-luatex texlive-latex-extra texlive-lang-other texlive-fonts-recommended fonts-dejavu-core poppler-utils
      - name: Compile both PDFs
        run: bash tong_hop_3_chuong_iot/build.sh
      - name: Verify PDFs
        run: |
          pdfinfo tong_hop_3_chuong_iot/iot_3_chuong.pdf | grep -E '^(Pages|Page size|File size):'
          pdfinfo tong_hop_3_chuong_iot/on_tap_tu_luan_6_cau.pdf | grep -E '^(Pages|Page size|File size):'
      - name: Upload both PDFs
        uses: actions/upload-artifact@v4
        with:
          name: iot-study-bundle-pdfs
          path: |
            tong_hop_3_chuong_iot/iot_3_chuong.pdf
            tong_hop_3_chuong_iot/on_tap_tu_luan_6_cau.pdf
      - name: Commit compiled PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f tong_hop_3_chuong_iot/iot_3_chuong.pdf tong_hop_3_chuong_iot/on_tap_tu_luan_6_cau.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Compile IoT 3-chapter and six-question PDFs"
            git pull --rebase origin main
            git push origin main
          fi
